<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>iPhone Sensor Meter</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

header {
    text-align: center;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
}

button {
    display: block;
    margin: 10px auto 20px;
    padding: 14px 30px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
}

.card {
    background: #222;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
}

.title {
    font-size: 14px;
    color: #aaa;
}

.value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.unit {
    font-size: 14px;
    color: #aaa;
}

.speed {
    grid-column: span 2;
    background: #202020;
}

.speed .value {
    font-size: 60px;
}

.status {
    text-align: center;
    color: #aaa;
    padding: 10px;
}
</style>
</head>

<body>

<header>
📱 iPhone SENSOR METER
</header>

<button onclick="startSensors()">
センサー開始
</button>

<div class="status" id="status">
センサー待機中
</div>

<div class="grid">

    <div class="card speed">
        <div class="title">GPS SPEED</div>
        <div class="value" id="speed">0.0</div>
        <div class="unit">km/h</div>
    </div>

    <div class="card">
        <div class="title">ALTITUDE</div>
        <div class="value" id="altitude">---</div>
        <div class="unit">m</div>
    </div>

    <div class="card">
        <div class="title">DISTANCE</div>
        <div class="value" id="distance">0.00</div>
        <div class="unit">km</div>
    </div>

    <div class="card">
        <div class="title">COMPASS</div>
        <div class="value" id="heading">---</div>
        <div class="unit">°</div>
    </div>

    <div class="card">
        <div class="title">PITCH</div>
        <div class="value" id="pitch">---</div>
        <div class="unit">°</div>
    </div>

    <div class="card">
        <div class="title">ROLL</div>
        <div class="value" id="roll">---</div>
        <div class="unit">°</div>
    </div>

    <div class="card">
        <div class="title">ACCELERATION X</div>
        <div class="value" id="accX">---</div>
        <div class="unit">m/s²</div>
    </div>

    <div class="card">
        <div class="title">ACCELERATION Y</div>
        <div class="value" id="accY">---</div>
        <div class="unit">m/s²</div>
    </div>

    <div class="card">
        <div class="title">ACCELERATION Z</div>
        <div class="value" id="accZ">---</div>
        <div class="unit">m/s²</div>
    </div>

    <div class="card">
        <div class="title">ROTATION α</div>
        <div class="value" id="alpha">---</div>
        <div class="unit">°/s</div>
    </div>

    <div class="card">
        <div class="title">ROTATION β</div>
        <div class="value" id="beta">---</div>
        <div class="unit">°/s</div>
    </div>

    <div class="card">
        <div class="title">ROTATION γ</div>
        <div class="value" id="gamma">---</div>
        <div class="unit">°/s</div>
    </div>

    <div class="card">
        <div class="title">LATITUDE</div>
        <div class="value" id="lat">---</div>
    </div>

    <div class="card">
        <div class="title">LONGITUDE</div>
        <div class="value" id="lon">---</div>
    </div>

</div>

<script>

let previousPosition = null;
let totalDistance = 0;


/* =========================
   センサー開始
========================= */

async function startSensors() {

    document.getElementById("status").innerText =
        "センサーを起動しています…";

    /* モーションセンサー */

    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {

        const permission =
            await DeviceMotionEvent.requestPermission();

        if (permission === "granted") {
            window.addEventListener(
                "devicemotion",
                motionHandler
            );
        }

    } else {

        window.addEventListener(
            "devicemotion",
            motionHandler
        );
    }


    /* デバイスの向き */

    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {

        const permission =
            await DeviceOrientationEvent.requestPermission();

        if (permission === "granted") {

            window.addEventListener(
                "deviceorientation",
                orientationHandler
            );
        }

    } else {

        window.addEventListener(
            "deviceorientation",
            orientationHandler
        );
    }


    /* GPS */

    if ("geolocation" in navigator) {

        navigator.geolocation.watchPosition(
            gpsHandler,
            gpsError,
            {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 10000
            }
        );

    }


    document.getElementById("status").innerText =
        "センサー動作中";
}


/* =========================
   GPS
========================= */

function gpsHandler(position) {

    const coords = position.coords;

    const latitude = coords.latitude;
    const longitude = coords.longitude;

    document.getElementById("lat").innerText =
        latitude.toFixed(6);

    document.getElementById("lon").innerText =
        longitude.toFixed(6);


    /* 速度 */

    if (coords.speed !== null &&
        coords.speed >= 0) {

        const speed =
            coords.speed * 3.6;

        document.getElementById("speed").innerText =
            speed.toFixed(1);
    }


    /* 高度 */

    if (coords.altitude !== null) {

        document.getElementById("altitude").innerText =
            coords.altitude.toFixed(1);
    }


    /* 移動距離 */

    if (previousPosition !== null) {

        const distance =
            calculateDistance(
                previousPosition.latitude,
                previousPosition.longitude,
                latitude,
                longitude
            );

        totalDistance += distance;

        document.getElementById("distance").innerText =
            totalDistance.toFixed(2);
    }


    previousPosition = {
        latitude: latitude,
        longitude: longitude
    };
}


/* =========================
   距離計算
========================= */

function calculateDistance(
    lat1,
    lon1,
    lat2,
    lon2
) {

    const R = 6371000;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLon =
        (lon2 - lon1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c =
        2 * Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c / 1000;
}


/* =========================
   GPSエラー
========================= */

function gpsError(error) {

    document.getElementById("status").innerText =
        "GPS取得エラー：" + error.message;
}


/* =========================
   加速度
========================= */

function motionHandler(event) {

    const a = event.accelerationIncludingGravity;

    if (!a) return;

    document.getElementById("accX").innerText =
        (a.x || 0).toFixed(2);

    document.getElementById("accY").innerText =
        (a.y || 0).toFixed(2);

    document.getElementById("accZ").innerText =
        (a.z || 0).toFixed(2);


    /* 回転速度 */

    if (event.rotationRate) {

        document.getElementById("alpha").innerText =
            (event.rotationRate.alpha || 0).toFixed(1);

        document.getElementById("beta").innerText =
            (event.rotationRate.beta || 0).toFixed(1);

        document.getElementById("gamma").innerText =
            (event.rotationRate.gamma || 0).toFixed(1);
    }
}


/* =========================
   方位・傾き
========================= */

function orientationHandler(event) {

    let heading = event.alpha;

    if (heading !== null) {

        document.getElementById("heading").innerText =
            heading.toFixed(0);
    }


    if (event.beta !== null) {

        document.getElementById("pitch").innerText =
            event.beta.toFixed(1);
    }


    if (event.gamma !== null) {

        document.getElementById("roll").innerText =
            event.gamma.toFixed(1);
    }
}

</script>

</body>
</html>
