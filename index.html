<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>iPhone Sensor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}

header {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 0 8px;
}


/* =========================
   センサー起動
========================= */

.sensorButton {

    display: block;

    margin: 5px auto 8px;

    padding: 13px 30px;

    border: none;

    border-radius: 12px;

    background: #3498db;

    color: white;

    font-size: 20px;

    font-weight: bold;
}

.sensorButton.off {
    background: #555;
}

.status {

    text-align: center;

    color: #aaa;

    margin: 5px;
}


/* =========================
   方位磁石
========================= */

.compassArea {

    text-align: center;

    margin-top: 8px;
}

.compass {

    width: 230px;
    height: 230px;

    border: 3px solid white;

    border-radius: 50%;

    margin: auto;

    position: relative;

    overflow: hidden;
}


/* 方位目盛り */

.compassScale {

    position: absolute;

    width: 100%;
    height: 100%;

    left: 0;
    top: 0;

    transform:
        rotate(0deg);
}


/* 目盛り */

.tick {

    position: absolute;

    left: 50%;
    top: 5px;

    width: 2px;
    height: 9px;

    background: #aaa;

    transform-origin:
        1px 110px;
}


/* 30度ごとの大きい目盛り */

.tick.major {

    height: 15px;

    width: 3px;

    background: white;
}


/* 方位文字 */

.cardinal {

    position: absolute;

    left: 50%;

    top: 20px;

    transform-origin:
        0 95px;

    font-size: 14px;

    font-weight: bold;
}


/* N */

.north {
    color: #ff4444;
}


/* 中央の方向指示 */

.compassCenter {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    text-align: center;

    z-index: 5;

    background: rgba(17,17,17,0.85);

    border-radius: 50%;

    width: 105px;
    height: 105px;

    padding-top: 23px;
}

.heading {

    font-size: 30px;

    font-weight: bold;
}

.directionName {

    font-size: 18px;

    color: #aaa;

    margin-top: 2px;
}


/* 上方向マーカー */

.compassMarker {

    position: absolute;

    top: 0;
    left: 50%;

    transform:
        translateX(-50%);

    width: 0;
    height: 0;

    border-left:
        8px solid transparent;

    border-right:
        8px solid transparent;

    border-top:
        18px solid #ff4444;

    z-index: 10;
}


/* =========================
   高度
========================= */

.info {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    padding: 10px;
}

.card {

    background: #222;

    border-radius: 14px;

    padding: 12px;

    text-align: center;
}

.label {

    color: #aaa;

    font-size: 14px;
}

.value {

    font-size: 30px;

    font-weight: bold;

    margin-top: 5px;
}

.unit {

    color: #aaa;

    font-size: 13px;
}


/* =========================
   高度グラフ
========================= */

.graph {

    background: #222;

    border-radius: 14px;

    margin: 10px;

    padding: 10px;
}

.graphTitle {

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 5px;
}

canvas {

    width: 100%;

    height: 140px;

    display: block;
}


/* =========================
   急変記録
========================= */

.eventSection {

    background: #222;

    border-radius: 14px;

    margin: 10px;

    padding: 12px;
}

.eventTitle {

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 8px;
}

.eventList {

    max-height: 180px;

    overflow-y: auto;
}

.event {

    border-top:
        1px solid #444;

    padding: 8px 3px;

    font-size: 14px;
}

.event:first-child {

    border-top: none;
}

.eventStrong {

    color: #ffcc00;

    font-weight: bold;
}


/* =========================
   移動距離
========================= */

.distanceSection {

    border-top:
        1px solid #333;

    margin-top: 15px;

    padding-top: 15px;

    padding-bottom: 20px;
}

.distanceTitle {

    text-align: center;

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 10px;
}

.distanceButtons {

    text-align: center;
}

.distanceButtons button {

    border: none;

    border-radius: 12px;

    padding: 13px 28px;

    margin: 4px;

    font-size: 20px;

    font-weight: bold;
}

.start {

    background: #2ecc71;

    color: white;
}

.end {

    background: #e74c3c;

    color: white;
}

button:disabled {

    opacity: 0.3;
}


/* 距離表示 */

.distanceMain {

    text-align: center;

    font-size: 42px;

    font-weight: bold;

    margin-top: 15px;
}

.distanceSub {

    text-align: center;

    color: #aaa;

    font-size: 18px;

    margin-top: 4px;
}

</style>

</head>


<body>


<header>
📱 iPhone SENSOR
</header>


<!-- =========================
     センサー
========================= -->

<button
class="sensorButton"
id="sensorButton"
onclick="toggleSensor()">

センサー起動

</button>


<div
class="status"
id="sensorStatus">

センサー停止中

</div>


<!-- =========================
     方位磁石
========================= -->

<div class="compassArea">

<div class="compass">


<div
class="compassMarker">
</div>


<div
class="compassScale"
id="compassScale">
</div>


<div class="compassCenter">

<div
class="heading"
id="direction">

000°

</div>

<div
class="directionName"
id="directionName">

N

</div>

</div>

</div>

</div>


<!-- =========================
     高度・急変
========================= -->

<div class="info">


<div class="card">

<div class="label">
高度
</div>

<div
class="value"
id="altitude">

---

</div>

<div class="unit">
m
</div>

</div>


<div class="card">

<div class="label">
急変
</div>

<div
class="value"
id="eventCount">

0

</div>

<div class="unit">
回
</div>

</div>


</div>


<!-- =========================
     高度グラフ
========================= -->

<div class="graph">

<div class="graphTitle">
🏔️ 高度
</div>

<canvas
id="altitudeGraph">
</canvas>

</div>


<!-- =========================
     急変記録
========================= -->

<div class="eventSection">

<div class="eventTitle">
⚡ 急激な変化
</div>

<div
class="eventList"
id="eventList">

<div class="event">
まだ記録はありません
</div>

</div>

</div>


<!-- =========================
     移動距離
========================= -->

<div class="distanceSection">


<div class="distanceTitle">
📏 移動距離
</div>


<div class="distanceButtons">


<button
class="start"
id="startButton"
onclick="startDistance()">

START

</button>


<button
class="end"
id="endButton"
onclick="endDistance()"
disabled>

END

</button>


</div>


<div
class="distanceMain"
id="distanceCm">

0 cm

</div>


<div
class="distanceSub"
id="distanceOther">

0.00 m　｜　0.000 km

</div>


</div>


<script>


/* ==================================================
   センサー
================================================== */

let sensorActive = false;


/* ==================================================
   距離
================================================== */

let distanceActive = false;

let gpsWatch = null;

let previousPosition = null;

let totalDistance = 0;


/* ==================================================
   高度
================================================== */

let altitudeData = [];


/* ==================================================
   急変
================================================== */

let eventCount = 0;

let lastEventTime = 0;


/*
   急変と判定する加速度

   15 m/s² ≒ 1.5G
*/

const EVENT_THRESHOLD = 15;


/*
   連続記録防止
*/

const EVENT_INTERVAL = 1000;


/* ==================================================
   方位目盛りを作る
================================================== */

function createCompass() {

    const scale =
        document.getElementById(
            "compassScale"
        );


    scale.innerHTML = "";


    /*
       10度ごとに目盛り
    */

    for (
        let deg = 0;
        deg < 360;
        deg += 10
    ) {

        const tick =
            document.createElement(
                "div"
            );


        tick.className = "tick";


        if (
            deg % 30 === 0
        ) {

            tick.classList.add(
                "major"
            );

        }


        tick.style.transform =

            "translateX(-50%) " +
            "rotate(" +
            deg +
            "deg)";


        scale.appendChild(
            tick
        );

    }

}


createCompass();


/* ==================================================
   センサーON/OFF
================================================== */

async function toggleSensor() {

    if (sensorActive) {

        stopSensor();

    }

    else {

        await startSensor();

    }

}


/* ==================================================
   センサー開始
================================================== */

async function startSensor() {

    sensorActive = true;


    document.getElementById(
        "sensorButton"
    ).innerText =
        "センサー停止";


    document.getElementById(
        "sensorButton"
    ).classList.add("off");


    document.getElementById(
        "sensorStatus"
    ).innerText =
        "センサー動作中";


    /*
       GPS
    */

    if ("geolocation" in navigator) {

        navigator.geolocation.watchPosition(

            sensorGPS,

            sensorGPSError,

            {
                enableHighAccuracy: true,

                maximumAge: 1000,

                timeout: 10000
            }

        );

    }


    /*
       加速度
    */

    if (
        typeof DeviceMotionEvent
        !== "undefined"
    ) {


        if (
            typeof
            DeviceMotionEvent
            .requestPermission
            === "function"
        ) {

            try {

                const permission =
                    await
                    DeviceMotionEvent
                    .requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    window.addEventListener(

                        "devicemotion",

                        accelerationUpdate

                    );

                }

            }
            catch(error) {

                console.log(error);

            }

        }

        else {

            window.addEventListener(

                "devicemotion",

                accelerationUpdate

            );

        }

    }


    /*
       コンパス
    */

    if (
        typeof
        DeviceOrientationEvent
        !== "undefined"
    ) {


        if (
            typeof
            DeviceOrientationEvent
            .requestPermission
            === "function"
        ) {

            try {

                const permission =
                    await
                    DeviceOrientationEvent
                    .requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    window.addEventListener(

                        "deviceorientation",

                        compassUpdate,

                        true

                    );

                }

            }
            catch(error) {

                console.log(error);

            }

        }

        else {

            window.addEventListener(

                "deviceorientation",

                compassUpdate,

                true

            );

        }

    }

}


/* ==================================================
   センサー停止
================================================== */

function stopSensor() {

    sensorActive = false;


    document.getElementById(
        "sensorButton"
    ).innerText =
        "センサー起動";


    document.getElementById(
        "sensorButton"
    ).classList.remove("off");


    document.getElementById(
        "sensorStatus"
    ).innerText =
        "センサー停止中";


    window.removeEventListener(

        "devicemotion",

        accelerationUpdate

    );


    window.removeEventListener(

        "deviceorientation",

        compassUpdate,

        true

    );

}


/* ==================================================
   センサーGPS
================================================== */

function sensorGPS(position) {

    if (!sensorActive)
        return;


    const c =
        position.coords;


    /*
       高度
    */

    if (
        c.altitude !== null
    ) {


        const altitude =
            c.altitude;


        document.getElementById(
            "altitude"
        ).innerText =
            altitude.toFixed(1);


        altitudeData.push(
            altitude
        );


        if (
            altitudeData.length > 100
        ) {

            altitudeData.shift();

        }


        drawGraph(

            "altitudeGraph",

            altitudeData

        );

    }

}


/* ==================================================
   加速度
================================================== */

function accelerationUpdate(event) {

    if (!sensorActive)
        return;


    const a =
        event.accelerationIncludingGravity;


    if (!a)
        return;


    const x =
        a.x || 0;

    const y =
        a.y || 0;

    const z =
        a.z || 0;


    const total =
        Math.sqrt(

            x * x +
            y * y +
            z * z

        );


    /*
       急変だけ記録
    */

    if (
        total >= EVENT_THRESHOLD
    ) {


        const now =
            Date.now();


        if (
            now - lastEventTime
            >= EVENT_INTERVAL
        ) {


            recordEvent(
                total
            );


            lastEventTime =
                now;

        }

    }

}


/* ==================================================
   急変記録
================================================== */

function recordEvent(value) {

    eventCount++;


    document.getElementById(
        "eventCount"
    ).innerText =
        eventCount;


    const list =
        document.getElementById(
            "eventList"
        );


    if (
        eventCount === 1
    ) {

        list.innerHTML = "";

    }


    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            "ja-JP",
            {
                hour: "2-digit",

                minute: "2-digit",

                second: "2-digit"
            }
        );


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "event";


    item.innerHTML =

        "⚡ " +
        time +
        "　" +

        "<span class='eventStrong'>" +

        value.toFixed(1) +

        " m/s²" +

        "</span>";


    list.insertBefore(

        item,

        list.firstChild

    );

}


/* ==================================================
   コンパス
================================================== */

function compassUpdate(event) {

    if (!sensorActive)
        return;


    let heading = null;


    /*
       iPhone Safari
    */

    if (
        event.webkitCompassHeading
        !== undefined
    ) {

        heading =
            event.webkitCompassHeading;

    }

    else if (
        event.alpha !== null
    ) {

        heading =
            event.alpha;

    }


    if (
        heading === null
    )
        return;


    heading =

        (
            heading % 360
            + 360
        ) % 360;


    /*
       数字
    */

    document.getElementById(
        "direction"
    ).innerText =

        String(
            Math.round(heading)
        ).padStart(3, "0")
        + "°";


    /*
       方位名
    */

    document.getElementById(
        "directionName"
    ).innerText =

        getDirectionName(
            heading
        );


    /*
       コンパスの目盛りを回転

       現在の方向を上に固定
    */

    document.getElementById(
        "compassScale"
    ).style.transform =

        "rotate(" +
        (-heading) +
        "deg)";

}


/* ==================================================
   方位名
================================================== */

function getDirectionName(deg) {

    const directions = [

        "N",
        "NNE",
        "NE",
        "ENE",
        "E",
        "ESE",
        "SE",
        "SSE",
        "S",
        "SSW",
        "SW",
        "WSW",
        "W",
        "WNW",
        "NW",
        "NNW"

    ];


    const index =
        Math.round(
            deg / 22.5
        ) % 16;


    return directions[index];

}


/* ==================================================
   START
================================================== */

function startDistance() {

    distanceActive = true;

    totalDistance = 0;

    previousPosition = null;


    updateDistanceDisplay();


    document.getElementById(
        "startButton"
    ).disabled =
        true;


    document.getElementById(
        "endButton"
    ).disabled =
        false;


    if (
        "geolocation"
        in navigator
    ) {


        gpsWatch =

            navigator.geolocation
            .watchPosition(

                distanceGPS,

                distanceError,

                {

                    enableHighAccuracy:
                        true,

                    maximumAge:
                        1000,

                    timeout:
                        10000

                }

            );

    }

}


/* ==================================================
   END
================================================== */

function endDistance() {

    distanceActive = false;


    if (
        gpsWatch !== null
    ) {


        navigator.geolocation
        .clearWatch(
            gpsWatch
        );


        gpsWatch = null;

    }


    document.getElementById(
        "startButton"
    ).disabled =
        false;


    document.getElementById(
        "endButton"
    ).disabled =
        true;


    updateDistanceDisplay();

}


/* ==================================================
   距離GPS
================================================== */

function distanceGPS(position) {

    if (!distanceActive)
        return;


    const c =
        position.coords;


    const lat =
        c.latitude;


    const lon =
        c.longitude;


    if (
        previousPosition !== null
    ) {


        const d =
            calculateDistance(

                previousPosition.lat,

                previousPosition.lon,

                lat,

                lon

            );


        /*
           GPS誤差を少し除外

           0.1km = 100m
        */

        if (
            d > 0 &&
            d < 0.1
        ) {

            totalDistance += d;

        }

    }


    previousPosition = {

        lat: lat,

        lon: lon

    };


    updateDistanceDisplay();

}


/* ==================================================
   距離表示
================================================== */

function updateDistanceDisplay() {

    const cm =
        totalDistance * 100000;


    const m =
        totalDistance * 1000;


    document.getElementById(
        "distanceCm"
    ).innerText =

        Math.round(cm)
        .toLocaleString()
        + " cm";


    document.getElementById(
        "distanceOther"
    ).innerText =

        m.toFixed(2)
        + " m　｜　"
        +
        totalDistance.toFixed(3)
        + " km";

}


/* ==================================================
   距離計算
================================================== */

function calculateDistance(

    lat1,
    lon1,
    lat2,
    lon2

) {


    const R =
        6371;


    const dLat =

        (lat2 - lat1)
        * Math.PI / 180;


    const dLon =

        (lon2 - lon1)
        * Math.PI / 180;


    const a =

        Math.sin(
            dLat / 2
        ) ** 2

        +

        Math.cos(
            lat1 *
            Math.PI / 180
        )

        *

        Math.cos(
            lat2 *
            Math.PI / 180
        )

        *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return R * c;

}


/* ==================================================
   高度グラフ
================================================== */

function drawGraph(

    canvasID,

    data

) {


    const canvas =
        document.getElementById(
            canvasID
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    const dpr =
        window.devicePixelRatio
        || 1;


    canvas.width =
        width * dpr;


    canvas.height =
        height * dpr;


    ctx.scale(
        dpr,
        dpr
    );


    ctx.clearRect(

        0,
        0,
        width,
        height

    );


    if (
        data.length < 2
    )
        return;


    let min =
        Math.min(...data);


    let max =
        Math.max(...data);


    if (
        max === min
    ) {

        max += 1;

        min -= 1;

    }


    const range =
        max - min;


    /*
       グリッド
    */

    ctx.strokeStyle =
        "#444";


    ctx.lineWidth =
        1;


    for (
        let i = 1;
        i < 4;
        i++
    ) {


        const y =
            height * i / 4;


        ctx.beginPath();


        ctx.moveTo(
            0,
            y
        );


        ctx.lineTo(
            width,
            y
        );


        ctx.stroke();

    }


    /*
       グラフ
    */

    ctx.strokeStyle =
        "#00ff88";


    ctx.lineWidth =
        3;


    ctx.beginPath();


    data.forEach(

        (value, index) => {


            const x =

                index *
                width /
                (data.length - 1);


            const y =

                height -

                (
                    (value - min)
                    / range
                )
                * height;


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }

    );


    ctx.stroke();

}


/* ==================================================
   エラー
================================================== */

function sensorGPSError(error) {

    console.log(
        "センサーGPS:",
        error.message
    );

}


function distanceError(error) {

    alert(

        "位置情報を取得できません。\n" +

        "iPhoneの位置情報を許可してください。"

    );

}

</script>

</body>

</html>
