<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>iPhone Sensor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}

header {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 0 8px;
}

/* =========================
   センサー起動
========================= */

.sensorButton {
    display: block;

    margin: 5px auto 8px;

    padding: 13px 30px;

    border: none;
    border-radius: 12px;

    background: #3498db;
    color: white;

    font-size: 20px;
    font-weight: bold;
}

.sensorButton.off {
    background: #555;
}

.status {
    text-align: center;
    color: #aaa;
    margin: 5px;
}


/* =========================
   コンパス
========================= */

.compassArea {
    text-align: center;
    margin-top: 5px;
}

.compass {
    width: 170px;
    height: 170px;

    border: 3px solid white;
    border-radius: 50%;

    margin: auto;

    position: relative;
}

.compass::before {
    content: "N";

    position: absolute;

    top: 8px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 20px;
    font-weight: bold;
}

.arrow {
    position: absolute;

    left: 50%;
    top: 25px;

    width: 4px;
    height: 60px;

    background: #e74c3c;

    transform-origin: 50% 60px;

    transform:
        translateX(-50%)
        rotate(0deg);
}

.arrow::after {
    content: "";

    position: absolute;

    top: -8px;
    left: -7px;

    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 18px solid #e74c3c;
}

.direction {
    font-size: 30px;
    font-weight: bold;
    margin-top: 5px;
}


/* =========================
   高度
========================= */

.info {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    padding: 10px;
}

.card {
    background: #222;

    border-radius: 14px;

    padding: 12px;

    text-align: center;
}

.label {
    color: #aaa;
    font-size: 14px;
}

.value {
    font-size: 30px;

    font-weight: bold;

    margin-top: 5px;
}

.unit {
    color: #aaa;
    font-size: 13px;
}


/* =========================
   高度グラフ
========================= */

.graph {
    background: #222;

    border-radius: 14px;

    margin: 10px;

    padding: 10px;
}

.graphTitle {
    font-size: 16px;
    font-weight: bold;

    margin-bottom: 5px;
}

canvas {
    width: 100%;
    height: 140px;

    display: block;
}


/* =========================
   急変記録
========================= */

.eventSection {

    background: #222;

    border-radius: 14px;

    margin: 10px;

    padding: 12px;
}

.eventTitle {

    font-size: 16px;
    font-weight: bold;

    margin-bottom: 8px;
}

.eventList {

    max-height: 180px;

    overflow-y: auto;
}

.event {

    border-top:
        1px solid #444;

    padding: 8px 3px;

    font-size: 14px;
}

.event:first-child {
    border-top: none;
}

.eventStrong {
    color: #ffcc00;

    font-weight: bold;
}


/* =========================
   距離測定
========================= */

.distanceSection {

    border-top:
        1px solid #333;

    margin-top: 15px;

    padding-top: 15px;
}

.distanceTitle {

    text-align: center;

    font-size: 19px;

    font-weight: bold;

    margin-bottom: 10px;
}

.distanceButtons {

    text-align: center;
}

.distanceButtons button {

    border: none;

    border-radius: 12px;

    padding: 13px 28px;

    margin: 4px;

    font-size: 20px;

    font-weight: bold;
}

.start {
    background: #2ecc71;
    color: white;
}

.end {
    background: #e74c3c;
    color: white;
}

button:disabled {
    opacity: 0.3;
}

.distanceValue {

    text-align: center;

    font-size: 38px;

    font-weight: bold;

    margin: 12px;
}

</style>

</head>


<body>


<header>
📱 iPhone SENSOR
</header>


<!-- =========================
     センサー
========================= -->

<button
class="sensorButton"
id="sensorButton"
onclick="toggleSensor()">

センサー起動

</button>


<div
class="status"
id="sensorStatus">

センサー停止中

</div>


<!-- =========================
     コンパス
========================= -->

<div class="compassArea">

<div class="compass">

<div
class="arrow"
id="arrow">
</div>

</div>

<div
class="direction"
id="direction">

0°

</div>

</div>


<!-- =========================
     高度
========================= -->

<div class="info">

<div class="card">

<div class="label">
高度
</div>

<div
class="value"
id="altitude">

---

</div>

<div class="unit">
m
</div>

</div>


<div class="card">

<div class="label">
急変
</div>

<div
class="value"
id="eventCount">

0

</div>

<div class="unit">
回

</div>

</div>

</div>


<!-- =========================
     高度グラフ
========================= -->

<div class="graph">

<div class="graphTitle">
🏔️ 高度
</div>

<canvas
id="altitudeGraph">
</canvas>

</div>


<!-- =========================
     急変記録
========================= -->

<div class="eventSection">

<div class="eventTitle">
⚡ 急激な変化
</div>

<div
class="eventList"
id="eventList">

<div class="event">
まだ記録はありません
</div>

</div>

</div>


<!-- =========================
     移動距離
========================= -->

<div class="distanceSection">

<div class="distanceTitle">
📏 移動距離
</div>


<div class="distanceButtons">

<button
class="start"
id="startButton"
onclick="startDistance()">

START

</button>


<button
class="end"
id="endButton"
onclick="endDistance()"
disabled>

END

</button>

</div>


<div
class="distanceValue"
id="distance">

0.00 km

</div>

</div>


<script>


/* ==================================================
   センサー
================================================== */

let sensorActive = false;


/* ==================================================
   GPS・距離
================================================== */

let distanceActive = false;

let gpsWatch = null;

let previousPosition = null;

let totalDistance = 0;


/* ==================================================
   高度
================================================== */

let altitudeData = [];


/* ==================================================
   急変検知
================================================== */

let eventCount = 0;

let lastEventTime = 0;


/*
   この値以上を「急激な変化」
   と判定する

   10 m/s² ≒ 1G
*/

const EVENT_THRESHOLD = 15;


/*
   同じ急変を連続記録しないための
   待ち時間（ミリ秒）
*/

const EVENT_INTERVAL = 1000;


/* ==================================================
   センサーON/OFF
================================================== */

async function toggleSensor() {

    if (sensorActive) {

        stopSensor();

    } else {

        await startSensor();

    }

}


/* ==================================================
   センサー開始
================================================== */

async function startSensor() {

    sensorActive = true;


    document.getElementById(
        "sensorButton"
    ).innerText =
        "センサー停止";


    document.getElementById(
        "sensorButton"
    ).classList.add("off");


    document.getElementById(
        "sensorStatus"
    ).innerText =
        "センサー動作中";


    /*
       GPS
    */

    if ("geolocation" in navigator) {

        navigator.geolocation.watchPosition(

            sensorGPS,

            sensorGPSError,

            {
                enableHighAccuracy: true,

                maximumAge: 1000,

                timeout: 10000
            }

        );

    }


    /*
       加速度センサー
    */

    if (
        typeof DeviceMotionEvent !==
        "undefined"
    ) {

        if (
            typeof DeviceMotionEvent
            .requestPermission ===
            "function"
        ) {

            try {

                const permission =
                    await
                    DeviceMotionEvent
                    .requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    window.addEventListener(
                        "devicemotion",
                        accelerationUpdate
                    );

                }

            } catch(error) {

                console.log(error);

            }

        } else {

            window.addEventListener(
                "devicemotion",
                accelerationUpdate
            );

        }

    }


    /*
       コンパス
    */

    if (
        typeof DeviceOrientationEvent !==
        "undefined"
    ) {

        if (
            typeof DeviceOrientationEvent
            .requestPermission ===
            "function"
        ) {

            try {

                const permission =
                    await
                    DeviceOrientationEvent
                    .requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    window.addEventListener(
                        "deviceorientation",
                        compassUpdate,
                        true
                    );

                }

            } catch(error) {

                console.log(error);

            }

        } else {

            window.addEventListener(
                "deviceorientation",
                compassUpdate,
                true
            );

        }

    }

}


/* ==================================================
   センサー停止
================================================== */

function stopSensor() {

    sensorActive = false;


    document.getElementById(
        "sensorButton"
    ).innerText =
        "センサー起動";


    document.getElementById(
        "sensorButton"
    ).classList.remove("off");


    document.getElementById(
        "sensorStatus"
    ).innerText =
        "センサー停止中";


    window.removeEventListener(
        "devicemotion",
        accelerationUpdate
    );


    window.removeEventListener(
        "deviceorientation",
        compassUpdate,
        true
    );

}


/* ==================================================
   センサーGPS
================================================== */

function sensorGPS(position) {

    if (!sensorActive)
        return;


    const c =
        position.coords;


    /*
       高度
    */

    if (
        c.altitude !== null
    ) {

        const altitude =
            c.altitude;


        document.getElementById(
            "altitude"
        ).innerText =
            altitude.toFixed(1);


        altitudeData.push(
            altitude
        );


        if (
            altitudeData.length > 100
        ) {

            altitudeData.shift();

        }


        drawGraph(
            "altitudeGraph",
            altitudeData
        );

    }

}


/* ==================================================
   加速度
================================================== */

function accelerationUpdate(event) {

    if (!sensorActive)
        return;


    const a =
        event.accelerationIncludingGravity;


    if (!a)
        return;


    const x =
        a.x || 0;

    const y =
        a.y || 0;

    const z =
        a.z || 0;


    /*
       3軸の合成加速度
    */

    const total =
        Math.sqrt(
            x * x +
            y * y +
            z * z
        );


    /*
       急激な変化だけ記録
    */

    if (
        total >= EVENT_THRESHOLD
    ) {

        const now =
            Date.now();


        /*
           1秒以内の連続検知を
           まとめる
        */

        if (
            now - lastEventTime
            >= EVENT_INTERVAL
        ) {

            recordEvent(
                total
            );

            lastEventTime =
                now;

        }

    }

}


/* ==================================================
   急変記録
================================================== */

function recordEvent(value) {

    eventCount++;


    document.getElementById(
        "eventCount"
    ).innerText =
        eventCount;


    const list =
        document.getElementById(
            "eventList"
        );


    /*
       最初のメッセージを削除
    */

    if (
        eventCount === 1
    ) {

        list.innerHTML = "";

    }


    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            "ja-JP",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "event";


    item.innerHTML =

        "⚡ " +
        time +
        "　" +

        "<span class='eventStrong'>" +

        value.toFixed(1) +

        " m/s²" +

        "</span>";


    /*
       新しい記録を上に追加
    */

    list.insertBefore(
        item,
        list.firstChild
    );

}


/* ==================================================
   コンパス
================================================== */

function compassUpdate(event) {

    if (!sensorActive)
        return;


    let heading = null;


    if (
        event.webkitCompassHeading
        !== undefined
    ) {

        heading =
            event.webkitCompassHeading;

    } else if (
        event.alpha !== null
    ) {

        heading =
            event.alpha;

    }


    if (
        heading === null
    )
        return;


    heading =
        (
            heading % 360
            + 360
        ) % 360;


    document.getElementById(
        "direction"
    ).innerText =
        heading.toFixed(0)
        + "°";


    document.getElementById(
        "arrow"
    ).style.transform =

        "translateX(-50%) " +
        "rotate(" +
        heading +
        "deg)";

}


/* ==================================================
   START
================================================== */

function startDistance() {

    distanceActive = true;

    totalDistance = 0;

    previousPosition = null;


    document.getElementById(
        "distance"
    ).innerText =
        "0.00 km";


    document.getElementById(
        "startButton"
    ).disabled =
        true;


    document.getElementById(
        "endButton"
    ).disabled =
        false;


    if (
        "geolocation"
        in navigator
    ) {

        gpsWatch =
            navigator.geolocation
            .watchPosition(

                distanceGPS,

                distanceError,

                {
                    enableHighAccuracy:
                        true,

                    maximumAge:
                        1000,

                    timeout:
                        10000
                }

            );

    }

}


/* ==================================================
   END
================================================== */

function endDistance() {

    distanceActive = false;


    if (
        gpsWatch !== null
    ) {

        navigator.geolocation
        .clearWatch(
            gpsWatch
        );

        gpsWatch = null;

    }


    document.getElementById(
        "startButton"
    ).disabled =
        false;


    document.getElementById(
        "endButton"
    ).disabled =
        true;


    document.getElementById(
        "distance"
    ).innerText =

        totalDistance.toFixed(2)
        + " km";

}


/* ==================================================
   距離GPS
================================================== */

function distanceGPS(position) {

    if (!distanceActive)
        return;


    const c =
        position.coords;


    const lat =
        c.latitude;

    const lon =
        c.longitude;


    if (
        previousPosition !== null
    ) {

        const d =
            calculateDistance(

                previousPosition.lat,

                previousPosition.lon,

                lat,

                lon

            );


        /*
           GPSの小さな誤差を除外
        */

        if (
            d > 0 &&
            d < 0.1
        ) {

            totalDistance += d;

        }

    }


    previousPosition = {

        lat: lat,

        lon: lon

    };


    document.getElementById(
        "distance"
    ).innerText =

        totalDistance.toFixed(2)
        + " km";

}


/* ==================================================
   距離計算
================================================== */

function calculateDistance(

    lat1,
    lon1,
    lat2,
    lon2

) {

    const R =
        6371;


    const dLat =
        (lat2 - lat1)
        * Math.PI / 180;


    const dLon =
        (lon2 - lon1)
        * Math.PI / 180;


    const a =

        Math.sin(
            dLat / 2
        ) ** 2

        +

        Math.cos(
            lat1 *
            Math.PI / 180
        )

        *

        Math.cos(
            lat2 *
            Math.PI / 180
        )

        *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return R * c;

}


/* ==================================================
   高度グラフ
================================================== */

function drawGraph(

    canvasID,

    data

) {

    const canvas =
        document.getElementById(
            canvasID
        );


    const ctx =
        canvas.getContext("2d");


    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    const dpr =
        window.devicePixelRatio
        || 1;


    canvas.width =
        width * dpr;


    canvas.height =
        height * dpr;


    ctx.scale(
        dpr,
        dpr
    );


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    if (
        data.length < 2
    )
        return;


    let min =
        Math.min(...data);


    let max =
        Math.max(...data);


    if (
        max === min
    ) {

        max += 1;

        min -= 1;

    }


    const range =
        max - min;


    /*
       グリッド
    */

    ctx.strokeStyle =
        "#444";


    ctx.lineWidth =
        1;


    for (
        let i = 1;
        i < 4;
        i++
    ) {

        const y =
            height * i / 4;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /*
       グラフ
    */

    ctx.strokeStyle =
        "#00ff88";


    ctx.lineWidth =
        3;


    ctx.beginPath();


    data.forEach(
        (value, index) => {

            const x =
                index *
                width /
                (data.length - 1);


            const y =
                height -
                (
                    (value - min)
                    / range
                ) * height;


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.stroke();

}


/* ==================================================
   エラー
================================================== */

function sensorGPSError(error) {

    console.log(
        "センサーGPS:",
        error.message
    );

}


function distanceError(error) {

    alert(
        "位置情報を取得できません。\n" +
        "iPhoneの位置情報を許可してください。"
    );

}

</script>

</body>
</html>
