<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>iPhone Sensor</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}

/* =========================
   ヘッダー
========================= */

header {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    padding: 15px 0 8px;
}


/* =========================
   START / END
========================= */

.controls {
    text-align: center;
    padding: 5px;
}

button {
    border: none;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    padding: 13px 28px;
    margin: 4px;
}

#startButton {
    background: #2ecc71;
    color: white;
}

#endButton {
    background: #e74c3c;
    color: white;
}

button:disabled {
    opacity: 0.3;
}

.status {
    text-align: center;
    color: #aaa;
    margin: 6px;
}


/* =========================
   コンパス
========================= */

.compassArea {
    text-align: center;
    margin-top: 5px;
}

.compass {
    width: 180px;
    height: 180px;

    border: 3px solid white;
    border-radius: 50%;

    margin: auto;

    position: relative;
}

.compass::before {
    content: "N";

    position: absolute;

    top: 8px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 20px;
    font-weight: bold;
}

.arrow {
    position: absolute;

    left: 50%;
    top: 25px;

    width: 4px;
    height: 65px;

    background: #e74c3c;

    transform-origin: 50% 65px;

    transform:
        translateX(-50%)
        rotate(0deg);
}

.arrow::after {
    content: "";

    position: absolute;

    top: -8px;
    left: -7px;

    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 18px solid #e74c3c;
}

.direction {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
}


/* =========================
   高度・距離
========================= */

.info {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    padding: 10px;
}

.card {
    background: #222;

    border-radius: 14px;

    padding: 13px;

    text-align: center;
}

.label {
    color: #aaa;
    font-size: 14px;
}

.value {
    font-size: 32px;

    font-weight: bold;

    margin-top: 5px;
}

.unit {
    color: #aaa;
    font-size: 13px;
}


/* =========================
   グラフ
========================= */

.graph {
    background: #222;

    border-radius: 14px;

    margin: 10px;

    padding: 10px;
}

.graphTitle {
    font-size: 16px;

    font-weight: bold;

    margin-bottom: 5px;
}

canvas {
    width: 100%;
    height: 150px;

    display: block;
}


/* =========================
   記録
========================= */

.record {
    background: #222;

    border-radius: 14px;

    margin: 10px;

    padding: 15px;

    text-align: center;
}

.recordTitle {
    color: #aaa;

    font-size: 14px;
}

.recordValue {
    font-size: 36px;

    font-weight: bold;

    margin-top: 5px;
}

</style>

</head>


<body>


<header>
📱 iPhone SENSOR
</header>


<div class="controls">

<button
    id="startButton"
    onclick="startMeasurement()">

START

</button>


<button
    id="endButton"
    onclick="endMeasurement()"
    disabled>

END

</button>

</div>


<div
    class="status"
    id="status">

待機中

</div>


<!-- =========================
     コンパス
========================= -->

<div class="compassArea">

<div class="compass">

<div
    class="arrow"
    id="arrow">
</div>

</div>


<div
    class="direction"
    id="direction">

0°

</div>

</div>


<!-- =========================
     高度・距離
========================= -->

<div class="info">


<div class="card">

<div class="label">
高度
</div>

<div
    class="value"
    id="altitude">

---

</div>

<div class="unit">
m
</div>

</div>


<div class="card">

<div class="label">
移動距離
</div>

<div
    class="value"
    id="distance">

0.00

</div>

<div class="unit">
km
</div>

</div>


</div>


<!-- =========================
     高度グラフ
========================= -->

<div class="graph">

<div class="graphTitle">
🏔️ 高度
</div>

<canvas
    id="altitudeGraph">
</canvas>

</div>


<!-- =========================
     加速度グラフ
========================= -->

<div class="graph">

<div class="graphTitle">
📈 加速度
</div>

<canvas
    id="accelerationGraph">
</canvas>

</div>


<!-- =========================
     記録
========================= -->

<div class="record">

<div class="recordTitle">
START → END 移動距離
</div>

<div
    class="recordValue"
    id="recordDistance">

0.00 km

</div>

</div>


<script>


/* ==================================================
   変数
================================================== */

let measuring = false;

let gpsWatch = null;

let previousPosition = null;

let totalDistance = 0;

let altitudeData = [];

let accelerationData = [];


/* ==================================================
   START
================================================== */

async function startMeasurement() {

    measuring = true;

    totalDistance = 0;

    previousPosition = null;

    altitudeData = [];

    accelerationData = [];


    document.getElementById(
        "distance"
    ).innerText = "0.00";


    document.getElementById(
        "recordDistance"
    ).innerText = "0.00 km";


    document.getElementById(
        "startButton"
    ).disabled = true;


    document.getElementById(
        "endButton"
    ).disabled = false;


    document.getElementById(
        "status"
    ).innerText =
        "測定中";


    /* =========================
       GPS
    ========================= */

    if ("geolocation" in navigator) {

        gpsWatch =
            navigator.geolocation.watchPosition(

                gpsUpdate,

                gpsError,

                {
                    enableHighAccuracy: true,

                    maximumAge: 1000,

                    timeout: 10000
                }
            );

    }


    /* =========================
       加速度センサー
    ========================= */

    if (
        typeof DeviceMotionEvent !==
        "undefined"
    ) {


        if (
            typeof DeviceMotionEvent
                .requestPermission ===
            "function"
        ) {

            try {

                const permission =
                    await
                    DeviceMotionEvent
                        .requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    window.addEventListener(

                        "devicemotion",

                        accelerationUpdate
                    );

                }

            }

            catch(error) {

                console.log(error);

            }

        }

        else {

            window.addEventListener(

                "devicemotion",

                accelerationUpdate
            );

        }

    }


    /* =========================
       コンパス
    ========================= */

    if (
        typeof DeviceOrientationEvent !==
        "undefined"
    ) {


        if (
            typeof DeviceOrientationEvent
                .requestPermission ===
            "function"
        ) {

            try {

                const permission =
                    await
                    DeviceOrientationEvent
                        .requestPermission();


                if (
                    permission ===
                    "granted"
                ) {

                    window.addEventListener(

                        "deviceorientation",

                        compassUpdate,

                        true
                    );

                }

            }

            catch(error) {

                console.log(error);

            }

        }

        else {

            window.addEventListener(

                "deviceorientation",

                compassUpdate,

                true
            );

        }

    }

}


/* ==================================================
   END
================================================== */

function endMeasurement() {

    measuring = false;


    if (gpsWatch !== null) {

        navigator.geolocation
            .clearWatch(gpsWatch);

        gpsWatch = null;

    }


    document.getElementById(
        "startButton"
    ).disabled = false;


    document.getElementById(
        "endButton"
    ).disabled = true;


    document.getElementById(
        "status"
    ).innerText =
        "測定終了";


    document.getElementById(
        "recordDistance"
    ).innerText =

        totalDistance.toFixed(2)
        + " km";

}


/* ==================================================
   GPS
================================================== */

function gpsUpdate(position) {

    if (!measuring) return;


    const c =
        position.coords;


    const latitude =
        c.latitude;


    const longitude =
        c.longitude;


    /* =========================
       高度
    ========================= */

    if (
        c.altitude !== null
    ) {

        const altitude =
            c.altitude;


        document.getElementById(
            "altitude"
        ).innerText =

            altitude.toFixed(1);


        altitudeData.push(
            altitude
        );


        if (
            altitudeData.length > 100
        ) {

            altitudeData.shift();

        }


        drawGraph(

            "altitudeGraph",

            altitudeData

        );

    }


    /* =========================
       距離
    ========================= */

    if (
        previousPosition !== null
    ) {


        const distance =
            calculateDistance(

                previousPosition.latitude,

                previousPosition.longitude,

                latitude,

                longitude

            );


        /*
        GPS誤差による距離増加を
        少し抑える
        */

        if (
            distance > 0 &&
            distance < 0.1
        ) {

            totalDistance +=
                distance;

        }

    }


    previousPosition = {

        latitude:
            latitude,

        longitude:
            longitude

    };


    document.getElementById(
        "distance"
    ).innerText =

        totalDistance.toFixed(2);

}


/* ==================================================
   距離計算
================================================== */

function calculateDistance(

    lat1,
    lon1,
    lat2,
    lon2

) {


    const R = 6371;


    const dLat =

        (lat2 - lat1)
        * Math.PI / 180;


    const dLon =

        (lon2 - lon1)
        * Math.PI / 180;


    const a =

        Math.sin(
            dLat / 2
        ) ** 2

        +

        Math.cos(
            lat1 * Math.PI / 180
        )

        *

        Math.cos(
            lat2 * Math.PI / 180
        )

        *

        Math.sin(
            dLon / 2
        ) ** 2;


    const c =

        2 *

        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(1 - a)

        );


    return R * c;

}


/* ==================================================
   加速度
================================================== */

function accelerationUpdate(event) {

    if (!measuring) return;


    const a =
        event.accelerationIncludingGravity;


    if (!a) return;


    const x =
        a.x || 0;


    const y =
        a.y || 0;


    const z =
        a.z || 0;


    /*
    3軸を合成した加速度
    */

    const total =

        Math.sqrt(

            x * x +

            y * y +

            z * z

        );


    accelerationData.push(
        total
    );


    if (
        accelerationData.length > 100
    ) {

        accelerationData.shift();

    }


    drawGraph(

        "accelerationGraph",

        accelerationData

    );

}


/* ==================================================
   コンパス
================================================== */

function compassUpdate(event) {

    if (!measuring) return;


    let heading = null;


    /*
    iPhoneの場合
    */

    if (
        event.webkitCompassHeading !==
        undefined
    ) {

        heading =
            event.webkitCompassHeading;

    }

    else if (
        event.alpha !== null
    ) {

        heading =
            event.alpha;

    }


    if (
        heading === null
    ) return;


    heading =

        (
            heading % 360
            + 360
        ) % 360;


    document.getElementById(
        "direction"
    ).innerText =

        heading.toFixed(0)
        + "°";


    document.getElementById(
        "arrow"
    ).style.transform =

        "translateX(-50%) rotate("
        + heading
        + "deg)";

}


/* ==================================================
   グラフ
================================================== */

function drawGraph(

    canvasID,

    data

) {


    const canvas =
        document.getElementById(
            canvasID
        );


    const ctx =
        canvas.getContext("2d");


    const width =
        canvas.clientWidth;


    const height =
        canvas.clientHeight;


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        width * dpr;


    canvas.height =
        height * dpr;


    ctx.scale(
        dpr,
        dpr
    );


    ctx.clearRect(

        0,
        0,
        width,
        height

    );


    if (
        data.length < 2
    ) return;


    let min =
        Math.min(...data);


    let max =
        Math.max(...data);


    if (
        max === min
    ) {

        max += 1;

        min -= 1;

    }


    const range =
        max - min;


    /* =========================
       グリッド
    ========================= */

    ctx.strokeStyle =
        "#444";

    ctx.lineWidth = 1;


    for (
        let i = 1;
        i < 4;
        i++
    ) {


        const y =

            height *
            i / 4;


        ctx.beginPath();


        ctx.moveTo(
            0,
            y
        );


        ctx.lineTo(
            width,
            y
        );


        ctx.stroke();

    }


    /* =========================
       グラフ線
    ========================= */

    ctx.strokeStyle =
        "#00ff88";


    ctx.lineWidth = 3;


    ctx.beginPath();


    data.forEach(

        (value, index) => {


            const x =

                index *
                width /
                (data.length - 1);


            const y =

                height -

                (
                    (value - min)
                    / range
                )
                * height;


            if (
                index === 0
            ) {

                ctx.moveTo(
                    x,
                    y
                );

            }

            else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }

    );


    ctx.stroke();

}


/* ==================================================
   GPSエラー
================================================== */

function gpsError(error) {

    document.getElementById(
        "status"
    ).innerText =
        "GPS取得エラー";

}

</script>

</body>
</html>
